      - generic [ref=f2e36]:
        - paragraph [ref=f2e38]: ‘‘
        - paragraph [ref=f2e40]:
          - text: We look to limit the uncertainty of litigation and define the range of possible outcomes.
          - generic [ref=f2e41]: ‘‘
      - paragraph [ref=f2e42]: We represent clients in all types of real estate litigation – from simple residential nonpayment proceedings to multi-million dollar commercial contract disputes. Our team has handled thousands of cases over the years and has decades of trial experience. Our partners’ experience provides a legal and business overview of a matter and enables us to appropriately utilize our knowledgeable and tenacious associates and paralegals when appropriate to deliver the best outcomes in an economic fashion.
      - paragraph [ref=f2e43]: Given the changes in the regulatory and legal areas and the current state of the courts and backlogs, we guide our clients with a broader economic approach– one that is cooperative when possible and adversarial when necessary.
      - paragraph [ref=f2e44]: Our firm routinely handles complex commercial leasing disputes, Yellowstone injunctions, holdover and nonpayment cases, rent regulation issues, coop and condo disputes, property damage claims, and construction disputes before New York State, Appellate and Trial Courts, and regulatory agencies and tribunals such as DHCR, ECB, and OATH.
