            - generic "Biography" [ref=f13e52]:
              - paragraph [ref=f13e53]: Zachary W. Worshtil is a partner at Powers & Worshtil, P.C., where he represents individuals and families in matters involving estate administration, estate and trust litigation, and estate planning. He is known for his thorough, solutions-oriented approach and his ability to guide clients through complex legal and financial issues with clarity and care.
              - paragraph [ref=f13e54]: A lifelong resident of Prince George’s County, Zach brings deep roots in the community to his practice. He graduated from Tulane University before earning his law degree from the University of Baltimore School of Law and an M.B.A. from the University of Baltimore Merrick School of Business. Following graduation, he served as judicial law clerk to the Honorable Albert W. Northrop of the Circuit Court for Prince George’s County, gaining extensive experience in litigation and the judicial process. He then entered private practice, working across several areas of law before focusing his practice on estates and trusts.
              - paragraph [ref=f13e55]: In addition to his client work, Zach has been appointed to numerous professional roles in the Maryland courts, reflecting the respect he has earned from the bench and bar. He also serves in leadership positions in several bar associations and professional organizations, helping to shape the future of trust and estate law in Maryland.
