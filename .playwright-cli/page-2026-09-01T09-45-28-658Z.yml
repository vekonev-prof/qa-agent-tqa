    - generic [ref=e44]:
      - heading "About Us" [level=2] [ref=e45]
      - paragraph [ref=e46]: CTBC offers an intimate, attentive, and responsive approach to our clients’ needs, goals and budgets. Considering the City and State of New York may be the most regulated real estate market, our decades of experience in the courts and administrative proceedings offers CTBC unique insight on how to best guide and advocate for our clients. Firms with ancillary real estate practices do not have the depth of knowledge and flexibility that CTBC has to keep up with the ever-changing regulatory landscape.
      - paragraph [ref=e47]: After years of large firm practice, CTBC was founded with the recognition that not every dispute necessitates the application of overwhelming force or a scorched earth approach. Instead, CTBC offers thoughtful case and client-tailored strategies to achieve the ultimate goal of victory that wins the war without breaking the bank.
