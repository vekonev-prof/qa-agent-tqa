        - generic [ref=f12e63]:
          - paragraph [ref=f12e64]: Losing a parent hits hard, and then paperwork and court rules show up right when you are grieving. Questions about who gets what can spark stress, especially if there is no will in place. At Powers & Worshtil, P.C., we have helped families in Prince George’s County, the DC Metro Area, and Southern Maryland resolve these issues for more than four decades.
          - paragraph [ref=f12e65]: "Our goal here is simple: give you clear information about children’s inheritance rights when a parent dies without a will in Maryland, for educational purposes only, not legal advice for your exact situation."
        - generic [ref=f12e66]:
          - heading "Intestate Succession Basics" [level=2] [ref=f12e67]
          - paragraph [ref=f12e68]:
            - text: “Intestate” means someone died without a valid will, which triggers Maryland’s intestacy rules in
            - link "Md. Code, Estates and Trusts, § 3–101" [ref=f12e69] [cursor=pointer]:
              - /url: https://law.justia.com/codes/maryland/estates-and-trusts/title-3/subtitle-1/section-3-101/
            - text: . These rules tell the court who inherits and how much, using a set order of priority. The process applies to probate assets, and the court supervises distribution to ensure it complies with the statute.
          - paragraph [ref=f12e70]: Intestacy uses a family-based formula, not personal wishes. Spouses and children come first, then parents, siblings, and more distant relatives. Even when a will exists, people who would qualify as heirs under intestacy law still count as “interested persons,” so they receive notices about the estate.
        - generic [ref=f12e71]:
          - heading "Children’s Inheritance Rights When a Parent Dies Intestate in Maryland" [level=2] [ref=f12e72]
          - paragraph [ref=f12e73]: A child’s share depends on whether the parent left a spouse and whether the children are minors or adults. The Maryland rules also consider whether the surviving spouse is the children’s parent. The result is a few common patterns, which we explain below.
          - paragraph [ref=f12e74]: The chart below summarizes the usual shares. It is a quick guide; if a detail here does not match your facts, the statute controls.
          - heading "If There Is No Surviving Spouse" [level=3] [ref=f12e75]
          - paragraph [ref=f12e76]: Children inherit everything in equal shares when there is no surviving spouse, under Md. Code, Estates and Trusts § 3–103. If a child died earlier and left descendants, that branch typically takes that child’s share by representation. This method keeps fairness among family lines.
          - heading "If There Is a Surviving Spouse and Minor Children" [level=3] [ref=f12e77]
          - paragraph [ref=f12e78]: When a spouse and at least one minor child survive, the spouse receives one-half of the intestate estate, and the children share the other half, per § 3–102(b). The split protects young children while also supporting the surviving spouse. That balance reflects Maryland’s policy choices, not the parents’ personal wishes.
          - heading "If There Is a Surviving Spouse and Adult Children (Who Are Also the Spouse’s Children)" [level=3] [ref=f12e79]
          - paragraph [ref=f12e80]: If all children are adults and also children of the surviving spouse, the spouse inherits the entire estate. In that case, the children do not inherit directly under intestacy. Distribution to children could still occur later if the spouse chooses to share or has estate plans of their own.
          - heading "If There Is a Surviving Spouse and Adult Children (Who Are Not Descendants of the Surviving Spouse)" [level=3] [ref=f12e81]
          - paragraph [ref=f12e82]: Where at least one adult child is not also the spouse’s descendant, the spouse takes the first $100,000 plus one-half of what remains, and the children receive the rest, under § 3–102(c). This rule recognizes blended families and aims for a practical split. Real numbers matter here, so an estate inventory becomes very important.
          - paragraph [ref=f12e83]: Here is a short recap you can save. It captures the core ideas about shares that impact children under Maryland law.
          - list [ref=f12e84]:
            - listitem [ref=f12e85]: No spouse, children split everything equally.
            - listitem [ref=f12e86]: Spouse with a minor child, 50 percent to spouse, 50 percent to children.
            - listitem [ref=f12e87]: If a spouse has only adult children, the spouse gets all.
            - listitem [ref=f12e88]: Spouse with an adult child from outside the marriage, spouse gets $100,000 plus half, children split the balance.
          - paragraph [ref=f12e89]: Other facts can shift timing or method of distribution, such as debts, expenses, or a child predeceasing with descendants. Good records help the personal representative apply the statute correctly. If a dispute crops up, the Orphans’ Court can address it.
        - generic [ref=f12e90]:
          - heading "How Children Receive Their Inheritance" [level=2] [ref=f12e91]
          - paragraph [ref=f12e92]: Probate is the court process that gathers assets, pays valid debts and taxes, and then transfers what is left to the heirs or beneficiaries. A personal representative is appointed by the Register of Wills or Orphans’ Court to handle this work. Even with a will, probate still applies to probate property unless it qualifies for small estate procedures.
          - paragraph [ref=f12e93]: Probate property means assets titled only in the decedent’s name with no beneficiary. Non-probate assets pass by contract or title and usually skip the estate. That split changes who gets paid first, and how quickly children receive funds.
          - paragraph [ref=f12e94]: "Common non-probate transfers include items like these. Each one follows its own paperwork and timeline:"
          - list [ref=f12e95]:
            - listitem [ref=f12e96]: Life insurance with a named beneficiary, including children or a trust for them.
            - listitem [ref=f12e97]: Retirement accounts with payable-on-death designations.
            - listitem [ref=f12e98]: Joint accounts with right of survivorship.
            - listitem [ref=f12e99]: Assets titled in a revocable trust.
          - paragraph [ref=f12e100]: "Here is a simple path many Maryland estates follow. Timelines vary, but these steps show the flow from start to finish:"
          - list [ref=f12e101]:
            - listitem [ref=f12e102]: Open the estate with the Register of Wills in the county where the decedent lived.
            - listitem [ref=f12e103]: Appointment of the personal representative, plus issuance of Letters of Administration.
            - listitem [ref=f12e104]: Notice to interested persons, including heirs under intestacy, and to creditors.
            - listitem [ref=f12e105]: An inventory and information report that lists probate and non-probate assets.
            - listitem [ref=f12e106]: Payment of valid debts, taxes, and expenses, then distributions under the statute.
            - listitem [ref=f12e107]: Final accounting and closing of the estate.
          - paragraph [ref=f12e108]: If a child is under 18, Maryland courts usually require a custodian, guardian of property, or trustee to hold that child’s share. A will or trust can solve this in advance with clear instructions. Without that plan, the court process still gets the assets to the child, just with more oversight.
        - generic [ref=f12e109]:
          - heading "Important Considerations Regarding Children and Intestacy" [level=2] [ref=f12e110]
          - paragraph [ref=f12e111]: Family structures vary, and the law tries to keep rules clear and predictable. The points below often come up when sorting out whether a child inherits. Small documents, like birth certificates or court orders, can make a big difference.
          - heading "Adopted Children" [level=3] [ref=f12e112]
          - paragraph [ref=f12e113]: Adopted children inherit just like biological children under Md. Code, Estates and Trusts, § 1–207. Legal adoption establishes the parent-child relationship for inheritance purposes. That status controls, not biology.
          - heading "Foster Children and Stepchildren" [level=3] [ref=f12e114]
          - paragraph [ref=f12e115]: Foster children and stepchildren do not inherit under intestacy by default, per § 1–205(b). A will or trust can provide for them, or a formal adoption can create inheritance rights. Families often use a will to add these loved ones directly.
          - heading "Illegitimate Children" [level=3] [ref=f12e116]
          - paragraph [ref=f12e117]: Children born outside of marriage can inherit from a parent, but proof of parentage might be required. Paternity can be shown in different ways, such as a court order, genetic testing, or certain acknowledgments. Sorting this out early helps the personal representative make correct distributions and avoid delays.
        - generic [ref=f12e118]:
          - heading "Why a Will Is Still Crucial" [level=2] [ref=f12e119]
          - paragraph [ref=f12e120]: Maryland’s formula is a backstop, not a plan. A will lets you choose who receives your property, in the amounts and at the times that match your values. That freedom matters for blended families, unmarried partners, and anyone with special goals.
          - paragraph [ref=f12e121]: "With a will, you can do things intestacy cannot, such as:"
          - list [ref=f12e122]:
            - listitem [ref=f12e123]: Leave a gift to grandchildren, including those born after you sign, through careful wording.
            - listitem [ref=f12e124]: Provide for stepchildren, foster children, or a close family friend who feels like kin.
            - listitem [ref=f12e125]: Set up a trust for a minor child, a child with disabilities, or a young adult who needs time to mature.
            - listitem [ref=f12e126]: Support a school, faith group, or charity that means a lot to your family.
          - paragraph [ref=f12e127]: You will also name your personal representative, which helps avoid fights over who should serve. Add powers of attorney and health care documents, and your family gets a full plan that works in life and after. Small steps now can spare your loved ones extra stress later.
