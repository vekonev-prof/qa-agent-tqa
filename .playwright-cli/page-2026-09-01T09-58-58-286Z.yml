          - paragraph [ref=f1e39]: ‘‘
          - paragraph [ref=f1e41]:
            - text: It is not unusual for me to work late into the evening. My clients know that I can be trusted to turn around assignments on time-sensitive matters as needed.
            - generic [ref=f1e42]: ‘‘
        - paragraph [ref=f1e43]: Susan is a founding partner of Cornicello, Tendler & Baumel-Cornicello, whose practice concentrates exclusively on real estate. As a lifelong New Yorker, business owner, and property owner, she has a deep understanding of the city’s real estate market. Combined with her 35+ years of legal experience, Susan is well-positioned to protect her clients’ interests. Whether she’s representing the Talmudic scholar in Brooklyn or the Queens mechanic who has built a thriving real estate portfolio, Susan understands her clients’ legal issues and gives honest assessments of disputes. Her sweet spot is counseling clients with 20-100-unit buildings, but she has advised clients whose buildings range from three units to housing complexes with more than 3,000 units.
        - paragraph [ref=f1e44]: Susan takes great pride in representing landlords in administrative matters regarding rent regulation, such as rent stabilization coverage issues, overcharge complaints, MCI applications, substantial rehabilitation applications, and demolition applications as well as in strategizing and litigating holdovers and non-payments in both commercial and residential disputes.
        - paragraph [ref=f1e45]: Susan remains current with the ever-changing real estate landscape and has performed hundreds of due diligence reviews for potential purchasers of buildings in New York City. Susan regularly uncovers potential overcharge liability and improperly deregulated apartments and works with owners and agents in recalculating rents, minimizing overcharge liability, and amending registration statements.
        - paragraph [ref=f1e46]: She has handled dozens of appeals during her career, successfully arguing before the Appellate Divisions in the First and Second Departments and Appellate Terms in the First and Second Department.
        - paragraph [ref=f1e47]:
          - text: Susan is committed to providing
          - emphasis [ref=f1e48]: pro bono
          - text: services — she routinely represents not-for-profits at DHCR and in landlord-tenant disputes, providing legal advice as needed.
        - paragraph [ref=f1e49]: Susan has spoken on various panels addressing today’s landlord-tenant landscape.
